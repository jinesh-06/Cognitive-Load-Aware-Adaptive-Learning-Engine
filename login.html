<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Adaptive Learning Platform</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Reusable 3D Background Engine -->
    <script src="three-background.js"></script>

    <style>
        :root {
            --bg-base: #030712;
            --card-bg: rgba(15, 23, 42, 0.72);
            --card-border: rgba(255, 255, 255, 0.12);
            --card-border-glow: rgba(99, 102, 241, 0.35);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --brand-primary: #6366f1;
            --brand-hover: #4f46e5;
            --brand-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            --input-bg: rgba(15, 23, 42, 0.65);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-focus: #818cf8;
            --input-focus-glow: rgba(99, 102, 241, 0.25);
            --error-color: #f87171;
            --error-bg: rgba(239, 68, 68, 0.1);
            --success-color: #34d399;
            --success-bg: rgba(16, 185, 129, 0.1);
            --social-bg: rgba(30, 41, 59, 0.6);
            --social-border: rgba(255, 255, 255, 0.1);
            --social-hover: rgba(255, 255, 255, 0.08);
            --shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(99, 102, 241, 0.12);
            --divider-line: rgba(255, 255, 255, 0.1);
            --glow-orb-1: rgba(99, 102, 241, 0.15);
            --glow-orb-2: rgba(168, 85, 247, 0.15);
        }

        [data-theme="light"] {
            --bg-base: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.9);
            --card-border-glow: rgba(99, 102, 241, 0.25);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --brand-primary: #4f46e5;
            --brand-hover: #4338ca;
            --brand-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #9333ea 100%);
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #cbd5e1;
            --input-focus: #6366f1;
            --input-focus-glow: rgba(99, 102, 241, 0.2);
            --error-color: #dc2626;
            --error-bg: rgba(220, 38, 38, 0.08);
            --success-color: #059669;
            --success-bg: rgba(5, 150, 105, 0.08);
            --social-bg: rgba(248, 250, 252, 0.8);
            --social-border: #e2e8f0;
            --social-hover: rgba(226, 232, 240, 0.8);
            --shadow: 0 20px 35px -5px rgba(0, 0, 0, 0.08), 0 8px 16px -6px rgba(0, 0, 0, 0.05);
            --divider-line: #e2e8f0;
            --glow-orb-1: rgba(99, 102, 241, 0.1);
            --glow-orb-2: rgba(217, 70, 239, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        color 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
            background-color: var(--bg-base);
            color: var(--text-primary);
        }

        /* 3D WebGL Canvas (Stays strictly behind UI, never captures clicks) */
        #webgl-bg {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* Ambient Glow Orbs */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }

        .ambient-orb-1 {
            top: 10%;
            left: 15%;
            width: 380px;
            height: 380px;
            background: var(--glow-orb-1);
        }

        .ambient-orb-2 {
            bottom: 12%;
            right: 15%;
            width: 420px;
            height: 420px;
            background: var(--glow-orb-2);
            animation-delay: -9s;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -30px) scale(1.1); }
            100% { transform: translate(-30px, 40px) scale(0.95); }
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            width: 46px;
            height: 46px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 20;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
            transition: all 0.25s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.08) rotate(15deg);
            border-color: var(--brand-primary);
            box-shadow: 0 0 16px var(--input-focus-glow);
        }

        /* Main Glass Login Card */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 2.75rem 2.25rem;
            box-shadow: var(--shadow);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            position: relative;
            z-index: 10;
            animation: cardAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Header & Branding */
        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-logo-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 1.1rem;
        }

        .brand-logo {
            width: 54px;
            height: 54px;
            background: var(--brand-gradient);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 1.65rem;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            position: relative;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .brand-logo:hover {
            transform: scale(1.06) rotate(3deg);
        }

        .brand-logo-glow {
            position: absolute;
            inset: -6px;
            background: var(--brand-gradient);
            border-radius: 20px;
            opacity: 0.4;
            filter: blur(12px);
            z-index: 1;
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { opacity: 0.35; transform: scale(1); }
            50% { opacity: 0.65; transform: scale(1.1); }
        }

        .brand-title {
            color: var(--text-primary);
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 0.35rem;
        }

        .brand-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 400;
            line-height: 1.4;
        }

        /* Social Auth Buttons */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.85rem;
            margin-bottom: 1.6rem;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem;
            background: var(--social-bg);
            border: 1px solid var(--social-border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn-social::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
        }

        .btn-social:hover {
            background: var(--social-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .btn-social.google:hover {
            border-color: #ea4335;
            color: #ea4335;
            box-shadow: 0 0 16px rgba(234, 67, 53, 0.25);
        }

        .btn-social.linkedin:hover {
            border-color: #0a66c2;
            color: #0a66c2;
            box-shadow: 0 0 16px rgba(10, 102, 194, 0.25);
        }

        .btn-social.github:hover {
            border-color: var(--input-focus);
            color: var(--input-focus);
            box-shadow: 0 0 16px rgba(129, 140, 248, 0.25);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin-bottom: 1.6rem;
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--divider-line);
        }

        .divider span {
            padding: 0 0.85rem;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .input-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control {
            width: 100%;
            padding: 0.95rem 1rem 0.95rem 2.85rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-control::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .form-control:focus {
            border-color: var(--input-focus);
            background: var(--input-bg);
            box-shadow: 0 0 0 4px var(--input-focus-glow);
        }

        .input-icon {
            position: absolute;
            left: 1.05rem;
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .form-control:focus + .input-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--input-focus);
        }

        .toggle-password {
            position: absolute;
            right: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.35rem;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background: transparent;
            border: none;
        }

        .toggle-password:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .error-message {
            color: var(--error-color);
            font-size: 0.76rem;
            font-weight: 500;
            margin-top: 0.4rem;
            display: none;
            align-items: center;
            gap: 0.35rem;
            animation: errorSlide 0.25s ease-out;
        }

        @keyframes errorSlide {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group.has-error .error-message {
            display: flex;
        }

        .form-group.has-error .form-control {
            border-color: var(--error-color);
            background: var(--error-bg);
        }

        /* Form Options (Remember Me & Forgot) */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.6rem;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
        }

        .remember-me input[type="checkbox"] {
            accent-color: var(--brand-primary);
            width: 17px;
            height: 17px;
            border-radius: 5px;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: var(--brand-hover);
            text-decoration: underline;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 0.95rem 1.25rem;
            background: var(--brand-gradient);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 0.98rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-submit::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.5);
            filter: brightness(1.05);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.75;
            cursor: not-allowed;
        }

        /* Spinner */
        .spinner {
            display: none;
            width: 19px;
            height: 19px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .card-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .card-footer a {
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 700;
            margin-left: 0.25rem;
            transition: color 0.2s ease;
        }

        .card-footer a:hover {
            color: var(--brand-hover);
            text-decoration: underline;
        }

        /* Floating Toast Notification */
        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
        }

        .toast {
            min-width: 300px;
            max-width: 420px;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 0.85rem;
            font-size: 0.9rem;
            font-weight: 500;
            pointer-events: auto;
            animation: toastSlideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s ease;
        }

        .toast.toast-success {
            border-left: 4px solid var(--success-color);
        }

        .toast.toast-success i {
            color: var(--success-color);
        }

        .toast.toast-error {
            border-left: 4px solid var(--error-color);
        }

        .toast.toast-error i {
            color: var(--error-color);
        }

        .toast.toast-info {
            border-left: 4px solid var(--brand-primary);
        }

        .toast.toast-info i {
            color: var(--brand-primary);
        }

        @keyframes toastSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes toastSlideOut {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            to {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            .login-card {
                padding: 2.25rem 1.5rem;
                border-radius: 22px;
            }
            .brand-title {
                font-size: 1.45rem;
            }
            .theme-toggle {
                top: 1rem;
                right: 1rem;
                width: 40px;
                height: 40px;
            }
            .toast-container {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
            }
            .toast {
                min-width: unset;
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- 3D Three.js Background Canvas -->
    <canvas id="webgl-bg"></canvas>

    <!-- Animated Ambient Lighting Orbs -->
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-orb ambient-orb-2"></div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light or dark theme" title="Toggle theme">
        <i class="fa-solid fa-moon"></i>
    </button>

    <!-- Centered Glassmorphic Login Card -->
    <main class="login-card" role="main">

        <!-- Header / Logo -->
        <header class="brand-header">
            <div class="brand-logo-wrap">
                <div class="brand-logo-glow"></div>
                <div class="brand-logo" aria-hidden="true">
                    <i class="fa-solid fa-brain"></i>
                </div>
            </div>
            <h1 class="brand-title">Adaptive Learning</h1>
            <p class="brand-subtitle">Sign in to your personalized workspace</p>
        </header>

        <!-- Social Authentication Grid -->
        <section class="social-auth" aria-label="Social sign in options">
            <div class="social-grid">
                <button type="button" class="btn-social google" onclick="handleOAuth('google')" title="Sign in with Google" aria-label="Sign in with Google">
                    <i class="fa-brands fa-google"></i>
                </button>
                <button type="button" class="btn-social linkedin" onclick="handleOAuth('linkedin')" title="Sign in with LinkedIn" aria-label="Sign in with LinkedIn">
                    <i class="fa-brands fa-linkedin-in"></i>
                </button>
                <button type="button" class="btn-social github" onclick="handleOAuth('github')" title="Sign in with GitHub" aria-label="Sign in with GitHub">
                    <i class="fa-brands fa-github"></i>
                </button>
            </div>
        </section>

        <!-- Divider -->
        <div class="divider" role="separator" aria-label="Or email credential">
            <span>or email credential</span>
        </div>

        <!-- Form -->
        <form id="loginForm" novalidate>

            <!-- Email Input -->
            <div class="form-group" id="emailGroup">
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope input-icon" aria-hidden="true"></i>
                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Name@domain.com"
                        required
                        autocomplete="email"
                        aria-label="Email address"
                        aria-describedby="emailError"
                    >
                </div>
                <span class="error-message" id="emailError" role="alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    Please enter a valid email address.
                </span>
            </div>

            <!-- Password Input -->
            <div class="form-group" id="passwordGroup">
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon" aria-hidden="true"></i>
                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                        aria-label="Password"
                        aria-describedby="passwordError"
                    >
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <span class="error-message" id="passwordError" role="alert">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    Password must be at least 8 characters long.
                </span>
            </div>

            <!-- Options (Remember device & Forgot password) -->
            <div class="form-options">
                <label class="remember-me" for="remember">
                    <input type="checkbox" id="remember">
                    <span>Remember device</span>
                </label>
                <a href="#" class="forgot-link" id="forgotLink">Forgot?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submitBtn" aria-label="Sign In">
                <span class="spinner" id="btnSpinner" aria-hidden="true"></span>
                <span id="btnText">Sign In</span>
            </button>

        </form>

        <!-- Footer -->
        <footer class="card-footer">
            Don't have an account?
            <a href="create-account.html">Create account</a>
        </footer>

    </main>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <script>
        // ==========================================
        // Toast Notification Helper
        // ==========================================
        function showToast(message, type = 'info', duration = 3500) {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            let iconClass = 'fa-circle-info';
            if (type === 'success') iconClass = 'fa-circle-check';
            if (type === 'error') iconClass = 'fa-circle-exclamation';

            toast.innerHTML = `
                <i class="fa-solid ${iconClass}"></i>
                <span>${message}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'toastSlideOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards';
                setTimeout(() => {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                }, 300);
            }, duration);
        }

        // ==========================================
        // DOM Elements
        // ==========================================
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = themeToggleBtn.querySelector('i');
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const togglePasswordIcon = togglePassword.querySelector('i');
        const submitBtn = document.getElementById('submitBtn');
        const btnSpinner = document.getElementById('btnSpinner');
        const btnText = document.getElementById('btnText');
        const forgotLink = document.getElementById('forgotLink');

        // ==========================================
        // Theme Toggle (Dark / Light)
        // ==========================================
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const isLight = (theme === 'light');
            themeIcon.className = isLight ? 'fa-solid fa-sun' : 'fa-solid fa-moon';

            if (window.ThreeBackground && typeof window.ThreeBackground.setTheme === 'function') {
                window.ThreeBackground.setTheme(theme);
            }

            try {
                localStorage.setItem('adaptive_learning_theme', theme);
            } catch (e) {}
        }

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(nextTheme);
        });

        // Initialize saved theme
        try {
            const savedTheme = localStorage.getItem('adaptive_learning_theme');
            if (savedTheme) {
                applyTheme(savedTheme);
            }
        } catch (e) {}

        // ==========================================
        // Password Visibility Toggle
        // ==========================================
        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            togglePasswordIcon.className = `fa-solid ${isPassword ? 'fa-eye-slash' : 'fa-eye'}`;
            togglePassword.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });

        // ==========================================
        // Forgot Password Trigger
        // ==========================================
        forgotLink.addEventListener('click', (e) => {
            e.preventDefault();
            const emailVal = emailInput.value.trim();
            if (emailVal && validateEmail(emailVal)) {
                showToast(`Password reset link sent to ${emailVal}. Please check your inbox.`, 'success');
            } else {
                showToast('Please enter your registered email address first, then click Forgot.', 'info');
                emailInput.focus();
            }
        });

        // ==========================================
        // Form Validation & Error Handling
        // ==========================================
        const validateEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        const validatePassword = (password) => password.length >= 8;

        function setFieldError(groupId, hasError) {
            const group = document.getElementById(groupId);
            if (!group) return;
            if (hasError) {
                group.classList.add('has-error');
            } else {
                group.classList.remove('has-error');
            }
        }

        emailInput.addEventListener('input', () => {
            if (emailInput.value) {
                setFieldError('emailGroup', !validateEmail(emailInput.value.trim()));
            } else {
                setFieldError('emailGroup', false);
            }
        });

        passwordInput.addEventListener('input', () => {
            if (passwordInput.value) {
                setFieldError('passwordGroup', !validatePassword(passwordInput.value));
            } else {
                setFieldError('passwordGroup', false);
            }
        });

        // ==========================================
        // Form Submission & Authentication
        // ==========================================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const emailVal = emailInput.value.trim();
            const passwordVal = passwordInput.value;

            const isEmailValid = validateEmail(emailVal);
            const isPasswordValid = validatePassword(passwordVal);

            setFieldError('emailGroup', !isEmailValid);
            setFieldError('passwordGroup', !isPasswordValid);

            if (!isEmailValid) {
                emailInput.focus();
                showToast('Please enter a valid email address.', 'error');
                return;
            }

            if (!isPasswordValid) {
                passwordInput.focus();
                showToast('Password must be at least 8 characters long.', 'error');
                return;
            }

            // Start Loading State
            submitBtn.disabled = true;
            btnSpinner.style.display = 'inline-block';
            btnText.textContent = 'Authenticating...';

            try {
                // Check server health/config if available
                try {
                    await fetch('/api/config').catch(() => {});
                } catch (e) {}

                // Construct authenticated user profile
                const isEmailAdmin = emailVal.toLowerCase().includes('admin') || emailVal.toLowerCase() === 'sarah.chen@stanford.edu';
                const formattedName = emailVal.split('@')[0].replace(/[._-]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

                const appUser = {
                    uid: 'usr-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                    name: formattedName || 'Learner',
                    email: emailVal,
                    avatarUrl: null,
                    emailVerified: true,
                    role: isEmailAdmin ? 'Admin' : 'Learner',
                    isAdmin: isEmailAdmin,
                    id: isEmailAdmin ? 'ADM-001' : 'usr-' + Date.now().toString().slice(-4),
                    isAuthenticated: true,
                    loginTime: new Date().toISOString()
                };

                try {
                    localStorage.setItem('adaptive_learning_user', JSON.stringify(appUser));
                    if (document.getElementById('remember').checked) {
                        localStorage.setItem('remember_device', 'true');
                    }
                } catch (storageErr) {
                    console.warn('Could not save user session to localStorage:', storageErr);
                }

                showToast('Authentication successful! Welcome to your workspace.', 'success', 2500);

                setTimeout(() => {
                    // Navigate to dashboard
                    window.location.href = '/dashboard';
                }, 800);

            } catch (err) {
                console.error('Login error:', err);
                submitBtn.disabled = false;
                btnSpinner.style.display = 'none';
                btnText.textContent = 'Sign In';
                showToast(err?.message || 'Authentication failed. Please try again.', 'error');
            }
        });

        // ==========================================
        // OAuth Handlers
        // ==========================================
        function handleOAuth(provider) {
            showToast(`Connecting to ${provider}...`, 'info', 2000);
            setTimeout(() => {
                window.location.href = `/api/auth/${provider.toLowerCase()}/login`;
            }, 300);
        }
    </script>
</body>

</html>
